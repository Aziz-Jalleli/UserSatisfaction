# ??????????????????????????????????????????????????????????????????????????????
# Quarkus Application Config
# ??????????????????????????????????????????????????????????????????????????????
quarkus.application.name=yelp-satisfaction-soap
quarkus.http.host=0.0.0.0
quarkus.http.port=8084

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8081
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,SOAPAction


# Connection pool
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=30

# ?? Hibernate ORM ?????????????????????????????????????????????????????????
# update = safe for existing schemas; adds columns/tables without dropping data
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.statistics=false
quarkus.hibernate-orm.sql-load-script=no-file

# ?? CXF SOAP Endpoint ?????????????????????????????????????????????????????
# Base path: /soap
# Full endpoint: http://localhost:8080/soap/satisfaction
# WSDL:          http://localhost:8080/soap/satisfaction?wsdl
#
# ??  DO NOT add quarkus.cxf.endpoint."/satisfaction".implementor here.
#     That property triggers a string-based class lookup at build time which
#     fails with ClassNotFoundException if the SEI interface is not on the
#     augmentation classpath.
#
#     The endpoint is registered via @CXFEndpoint("/satisfaction") on
#     UserSatisfactionServiceImpl ? Quarkus CXF resolves it from bytecode,
#     not from a string, so the classloader issue never occurs.
quarkus.cxf.path=/soap

# ?? Logging ???????????????????????????????????????????????????????????????
quarkus.log.level=INFO
quarkus.log.category."com.satisfaction".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# ?? Health ????????????????????????????????????????????????????????????????
quarkus.health.extensions.enabled=true

# ??????????????????????????????????????????????????????????????????????????????
# Test Profile  (./mvnw test)
# ??????????????????????????????????????????????????????????????????????????????
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/RepaireHub_test
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.log.category."com.satisfaction".level=DEBUG
quarkus.native.additional-build-args=--initialize-at-run-time=edu.stanford.nlp